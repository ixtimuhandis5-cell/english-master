<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Master - IELTS gacha</title>
<style>
:root{--bg:#f3f6fc;--card:#fff;--ink:#1e2842;--mut:#6b7794;--pri:#4f46e5;--pri2:#7c3aed;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b;--line:#e2e8f4}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:20px}
.stats span{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;margin-left:6px;font-weight:600;font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:0;background:#eef1fb;color:var(--ink);padding:9px 14px;border-radius:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:14px}
nav button.on{background:var(--pri);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
h2{margin:18px 0 8px}
.mut{color:var(--mut)}
.hero{background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(30,40,66,.07);margin-bottom:10px}
.pbar,.bar{height:12px;background:#e6eaf6;border-radius:10px;overflow:hidden;flex:1}
.pbar i,.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#4ade80);border-radius:10px;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(30,40,66,.07);border:2px solid transparent}
.topic,.item{cursor:pointer;transition:.15s}
.topic:hover,.item:hover{transform:translateY(-2px);border-color:var(--pri)}
.topic .ic{font-size:30px}
.topic b{display:block}
.stars{color:var(--warn);letter-spacing:2px}
.tag{background:#eef1fb;border-radius:8px;padding:2px 8px;font-size:12px;margin-left:6px;color:var(--pri)}
.lvh{display:flex;align-items:center;gap:8px;margin-top:22px}
.lvh .b{background:var(--pri);color:#fff;border-radius:10px;padding:2px 12px;font-weight:700}
button.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;font-size:15px;margin:4px 4px 4px 0}
button.btn:hover{filter:brightness(1.1)}
button.btn.sec{background:#eef1fb;color:var(--ink)}
button.btn.ok{background:var(--ok)}
button.btn.red{background:var(--bad)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:10px 0}
.games button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:700;cursor:pointer;font-size:14px}
.games button:hover{border-color:var(--pri);background:#f5f4ff}
table{border-collapse:collapse;width:100%;background:#fff;border-radius:12px;overflow:hidden}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{background:#eef1fb}
.spk{background:#eef1fb;border:0;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:15px}
.spk:hover{background:#dfe4fa}
.intro{background:#fffbea;border-left:5px solid var(--warn);padding:10px 14px;border-radius:10px;margin:10px 0}
.intro ul{margin:6px 0;padding-left:20px}
.gh{display:flex;gap:10px;align-items:center}
.x{border:0;background:none;font-size:20px;cursor:pointer}
.gt{text-align:center;color:var(--mut);margin:8px 0}
.panel{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 10px rgba(30,40,66,.07);text-align:center}
.q{font-size:24px;font-weight:700;margin:12px 0}
.hint{color:var(--mut);margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(max-width:560px){.opts{grid-template-columns:1fr}.q{font-size:20px}}
.opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:16px;font-weight:600;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--pri);background:#f5f4ff}
.opt.ok{background:#dcfce7;border-color:var(--ok)}
.opt.bad{background:#fee2e2;border-color:var(--bad)}
.fb{margin-top:14px;padding:14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;text-align:left}
.fb.ok{background:#dcfce7;color:#14532d}
.fb.bad{background:#fee2e2;color:#7f1d1d}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:50px;margin:10px 0;padding:8px;border-radius:12px}
.chips.ans{border-bottom:3px solid var(--line);background:#fafbff}
.chip{background:#eef1fb;border:2px solid var(--line);border-radius:10px;padding:8px 13px;font-weight:700;cursor:pointer;font-size:18px}
.chip.ghost{opacity:.25;cursor:default}
input[type=text],textarea,select{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit}
textarea{min-height:220px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.m{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-weight:600;cursor:pointer}
.m.sel{border-color:var(--pri);background:#eeedff}
.m.done{background:#dcfce7;border-color:var(--ok);opacity:.6;cursor:default}
.m.err{animation:sh .3s;border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.passage{background:#fff;border-radius:14px;padding:16px;border-left:5px solid var(--pri);margin:10px 0;font-size:17px}
.tq{background:#fff;border-radius:14px;padding:12px 14px;margin:10px 0}
.rd{display:block;padding:7px 10px;border-radius:8px;cursor:pointer}
.rd:hover{background:#f1f3fb}
.rd.ok{background:#dcfce7}
.rd.bad{background:#fee2e2}
details{background:#fff;border-radius:14px;padding:10px 14px;margin:8px 0;box-shadow:0 1px 6px rgba(30,40,66,.06)}
summary{cursor:pointer;font-weight:700}
details ul,details ol{margin:8px 0;padding-left:22px}
.res{text-align:center;padding:24px}
.big{font-size:56px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.badge{display:inline-block;background:#fff;border-radius:14px;padding:10px 14px;margin:4px;box-shadow:0 1px 6px rgba(30,40,66,.08)}
.badge.off{opacity:.35;filter:grayscale(1)}
.timer{font-size:40px;font-weight:800;text-align:center;color:var(--pri)}
.an{background:#f0fdf4;border-left:5px solid var(--ok);padding:12px 16px;border-radius:10px;margin-top:10px}
.an li{margin:3px 0}
footer{text-align:center;color:var(--mut);font-size:13px;padding:24px}
</style>
</head>
<body>
<header>
  <h1>🎓 English Master <small style="font-weight:400">A1 → IELTS 7+</small></h1>
  <div class="stats"><span id="sx">⭐ 0 XP</span><span id="ss">🔥 0 kun</span></div>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<footer>English Master • Natijalar shu kompyuter/brauzerda saqlanadi • Mikrofon uchun Google Chrome tavsiya etiladi</footer>

<script>
/* ============ ASOSIY YORDAMCHILAR ============ */
const LS="english_master_v1";
let S={xp:0,streak:0,last:"",done:{},right:0,total:0,reading:{},listening:{},mocks:[]};
try{const x=JSON.parse(localStorage.getItem(LS));if(x)S=Object.assign(S,x)}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const app=()=>$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9' ]/g,"").replace(/\s+/g," ").trim();
function dayStr(d){return new Date(d).toISOString().slice(0,10)}
function touchStreak(){const t=dayStr(Date.now());if(S.last===t)return;S.streak=(S.last===dayStr(Date.now()-864e5))?S.streak+1:1;S.last=t;save();head()}
function addXP(n){S.xp+=n;touchStreak();save();head()}
function head(){$("#sx").textContent="⭐ "+S.xp+" XP";$("#ss").textContent="🔥 "+S.streak+" kun"}
function bind(sel,fn){$$(sel).forEach(e=>e.addEventListener("click",()=>fn(e)))}

/* Ovoz (TTS) */
let RATE=0.9;
function speak(t,r){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r||RATE;const v=speechSynthesis.getVoices().find(v=>/^en[-_](US|GB)/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b)speak(b.dataset.say,b.dataset.rate?+b.dataset.rate:0)});
/* Mikrofon (SR) */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
function startSR(onres,onend,cont){if(!SRC)return null;try{const r=new SRC();r.lang="en-US";r.interimResults=true;r.continuous=!!cont;r.onresult=e=>{let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript+" ";onres(s.trim())};r.onend=()=>onend&&onend();r.onerror=()=>{};r.start();return r}catch(e){return null}}
function sim(a,b){const x=norm(a).split(" "),y=norm(b).split(" ");if(!y[0])return 0;let c=0;y.forEach(w=>{if(x.includes(w))c++});return c/Math.max(x.length,y.length)}

/* ============ MAVZULAR (DARSLAR) ============ */
const LEVELS={A1:"Boshlang'ich • IELTS ~3.0",A2:"Elementar • IELTS 3.5–4.0",B1:"O'rta • IELTS 4.5–5.5",B2:"Yuqori-o'rta • IELTS 6.0–6.5",C1:"Ilg'or • IELTS 7.0+"};
const TOPICS=[
/* ---------- A1 ---------- */
{id:"num",lv:"A1",ic:"🎨",t:"Ranglar, kunlar, raqamlar",
intro:`<p>Eng asosiy so'zlar. Har kuni ishlatasiz!</p><ul><li>Hafta kunlari va oylar <b>bosh harf</b> bilan yoziladi: Monday, Friday, May.</li><li>1–10: one, two, three, four, five, six, seven, eight, nine, ten.</li><li>O'nliklar: twenty, thirty, forty, fifty… Tartib sonlar: first, second, third.</li></ul>`,
w:[["red","qizil"],["blue","ko'k"],["green","yashil"],["yellow","sariq"],["black","qora"],["white","oq"],["Monday","dushanba"],["Tuesday","seshanba"],["Friday","juma"],["Sunday","yakshanba"],["twenty","yigirma"],["hundred","yuz"],["thousand","ming"],["first","birinchi"]],
g:[["The sky is ___.",["blue","red","black"],0],["The day after Monday is ___.",["Tuesday","Sunday","Friday"],0],["10 × 10 = one ___.",["hundred","thousand","twenty"],0],["Grass is ___.",["green","white","yellow"],0],["Saturday and ___ are the weekend.",["Sunday","Monday","Friday"],0]]},
{id:"be",lv:"A1",ic:"🙋",t:"To be: am / is / are",
intro:`<p><b>To be</b> — «bo'lmoq». Har bir olmosh o'z shakli bilan keladi:</p><ul><li><b>I am</b> (men), <b>He / She / It is</b> (u), <b>We / You / They are</b> (biz / siz / ular)</li><li>Inkor: <b>not</b> qo'shamiz → I am <b>not</b>, She is<b>n't</b></li><li>Savol: to be gap boshiga chiqadi → <b>Are</b> you ready?</li></ul>`,
w:[["I am a student","Men talabaman"],["She is my sister","U mening opam"],["He is a doctor","U shifokor"],["We are friends","Biz do'stmiz"],["They are at home","Ular uyda"],["It is a cat","Bu mushuk"],["You are late","Siz kechikdingiz"],["I am not tired","Men charchamadim"],["Are you ready?","Tayyormisiz?"],["Is he here?","U shu yerdami?"]],
g:[["She ___ a teacher.",["am","is","are"],1],["We ___ from Uzbekistan.",["is","are","am"],1],["I ___ not hungry.",["am","is","are"],0],["___ they at school?",["Is","Am","Are"],2],["It ___ a big city.",["are","is","am"],1],["You ___ very kind.",["is","am","are"],2]]},
{id:"art",lv:"A1",ic:"📘",t:"Artikllar: a / an / the",
intro:`<p>Artikl — otdan oldin keladigan kichik so'z.</p><ul><li><b>a</b> — undosh <i>tovush</i> bilan boshlansa: a book, a university (yu-tovush)</li><li><b>an</b> — unli <i>tovush</i> bilan boshlansa: an apple, an hour (h aytilmaydi)</li><li><b>the</b> — aniq, ma'lum narsa: the sun, the door</li></ul><p>Muhim: harfga emas, <b>tovushga</b> qarang!</p>`,
w:[["a book","bitta kitob"],["an apple","bitta olma"],["an hour","bir soat"],["a university","bitta universitet"],["the sun","quyosh"],["the moon","oy"],["an umbrella","soyabon"],["a unique idea","noyob g'oya"],["the internet","internet"],["a European city","Yevropa shahri"]],
g:[["I have ___ orange.",["a","an","the"],1],["She is ___ engineer.",["a","an","the"],1],["___ sun is hot.",["A","An","The"],2],["He goes to ___ university.",["a","an","the"],0],["It takes ___ hour.",["a","an","the"],1],["Can you close ___ door, please?",["a","an","the"],2]]},
{id:"qw",lv:"A1",ic:"❓",t:"Savol so'zlari va predloglar",
intro:`<p><b>Savol so'zlari:</b> What (nima), Where (qayerda), When (qachon), Why (nega), Who (kim), How (qanday).</p><ul><li><b>in</b> — ichida / yil, oy: in 2020, in May</li><li><b>on</b> — ustida / kun: on the table, on Monday</li><li><b>at</b> — aniq nuqta / soat: at 5 o'clock, at school</li></ul>`,
w:[["What","nima"],["Where","qayerda"],["When","qachon"],["Why","nega"],["Who","kim"],["How","qanday"],["in","ichida"],["on","ustida"],["at","-da (nuqta)"],["under","ostida"],["between","orasida"],["behind","orqasida"]],
g:[["___ is your name?",["What","Where","Why"],0],["The book is ___ the table.",["on","in","at"],0],["I was born ___ 1999.",["on","in","at"],1],["The meeting is ___ 5 o'clock.",["in","on","at"],2],["___ do you live? In Tashkent.",["Where","Who","When"],0]]},
{id:"fam",lv:"A1",ic:"👨‍👩‍👧",t:"Oila va odamlar",
intro:`<p>Oila a'zolari. Eslab qoling: <b>parents</b> = ota-ona, <b>grandparents</b> = bobo-buvi, <b>siblings</b> = aka-uka/opa-singillar.</p>`,
w:[["mother","ona"],["father","ota"],["brother","aka / uka"],["sister","opa / singil"],["grandmother","buvi"],["grandfather","bobo"],["uncle","amaki / tog'a"],["aunt","xola / amma"],["cousin","amakivachcha"],["husband","er"],["wife","xotin"],["parents","ota-ona"],["daughter","qizi"],["son","o'g'li"]],
g:[["My mother's brother is my ___.",["uncle","cousin","grandfather"],0],["My father's father is my ___.",["grandfather","uncle","son"],0],["My sister's daughter is my ___.",["niece","aunt","wife"],0],["My parents' parents are my ___.",["grandparents","children","cousins"],0],["I have two ___, a boy and a girl.",["children","parents","husbands"],0]]},
{id:"food",lv:"A1",ic:"🍎",t:"Ovqat va ichimlik",
intro:`<p>Sanaladigan va sanalmaydigan narsalar: <b>an apple</b> (sanaladi), lekin <b>some rice</b>, <b>some water</b> (sanalmaydi). «Qancha?» → <b>How much</b> water? «Nechta?» → <b>How many</b> apples?</p>`,
w:[["bread","non"],["rice","guruch"],["meat","go'sht"],["chicken","tovuq"],["fish","baliq"],["vegetables","sabzavotlar"],["fruit","meva"],["milk","sut"],["water","suv"],["tea","choy"],["soup","sho'rva"],["sugar","shakar"],["salt","tuz"],["egg","tuxum"]],
g:[["I drink ___ with sugar every morning.",["tea","bread","rice"],0],["Apples and bananas are ___.",["fruit","meat","soup"],0],["Chicken is a type of ___.",["meat","fruit","salt"],0],["Add some ___ to the soup. It is not salty enough.",["salt","sugar","milk"],0],["Plov is made of ___ and meat.",["rice","fish","eggs"],0]]},
{id:"ps",lv:"A1",ic:"🔁",t:"Present Simple (odat, doimiy ish)",
intro:`<p>Odat, doimiy holat va haqiqatlar uchun.</p><ul><li>I / you / we / they + <b>fe'l</b>: I work</li><li>He / she / it + <b>fe'l + s/es</b>: She work<b>s</b>, He go<b>es</b></li><li>Inkor: <b>don't / doesn't</b> + fe'l: He <b>doesn't</b> drink tea</li><li>Savol: <b>Do / Does</b> + ega + fe'l?</li><li>Belgilar: always, usually, often, sometimes, never, every day</li></ul>`,
w:[["I wake up at 7","Men soat 7 da uyg'onaman"],["She works in a bank","U bankda ishlaydi"],["He doesn't drink tea","U choy ichmaydi"],["Do you speak English?","Ingliz tilida gapirasizmi?"],["They play football on Sundays","Ular yakshanba futbol o'ynaydi"],["The sun rises in the east","Quyosh sharqdan chiqadi"],["My brother studies a lot","Akam ko'p o'qiydi"],["Water boils at 100 degrees","Suv 100 darajada qaynaydi"]],
g:[["He ___ to school every day.",["go","goes","going"],1],["They ___ not like coffee.",["do","does","is"],0],["She ___ English very well.",["speak","speaks","speaking"],1],["___ you live here?",["Do","Does","Are"],0],["My mother ___ TV in the evening.",["watch","watches","watchs"],1],["It ___ rain much in summer.",["don't","doesn't","isn't"],1]]},
{id:"pc",lv:"A1",ic:"⏳",t:"Present Continuous (hozir bo'layotgan)",
intro:`<p>Aynan hozir yoki shu kunlarda bo'layotgan ish.</p><ul><li><b>am / is / are + fe'l-ing</b>: I am reading</li><li>Inkor: She is <b>not</b> sleeping</li><li>Savol: <b>Are</b> you listening?</li><li>Belgilar: now, at the moment, look!, listen!</li></ul>`,
w:[["I am reading now","Men hozir o'qiyapman"],["She is cooking dinner","U kechki ovqat tayyorlayapti"],["They are playing outside","Ular tashqarida o'ynayapti"],["Are you listening?","Tinglayapsizmi?"],["It is raining","Yomg'ir yog'yapti"],["We are not sleeping","Biz uxlamayapmiz"],["He is talking on the phone","U telefonda gaplashyapti"],["What are you doing?","Nima qilyapsiz?"]],
g:[["Look! It ___ snowing.",["is","are","does"],0],["They ___ watching a film now.",["is","are","do"],1],["I ___ studying at the moment.",["am","is","are"],0],["She ___ not working today.",["are","is","do"],1],["___ he sleeping?",["Is","Does","Are"],0],["We ___ having lunch.",["is","am","are"],2]]},
{id:"rout",lv:"A1",ic:"⏰",t:"Kundalik tartib",
intro:`<p>Kun tartibini aytish uchun: <b>I wake up at 7</b>, <b>I have breakfast</b>. Chastota so'zlari fe'ldan <b>oldin</b>, to be dan <b>keyin</b> keladi: I <b>always</b> get up early. She is <b>never</b> late.</p>`,
w:[["wake up","uyg'onmoq"],["get dressed","kiyinmoq"],["have breakfast","nonushta qilmoq"],["go to work","ishga bormoq"],["study","o'qimoq"],["have lunch","tushlik qilmoq"],["come back","qaytib kelmoq"],["do homework","uy vazifasini qilmoq"],["go to bed","uxlashga yotmoq"],["usually","odatda"],["always","doim"],["never","hech qachon"],["sometimes","ba'zan"]],
g:[["I ___ at 6 o'clock every morning.",["wake up","go to bed","have lunch"],0],["I am never late. I ___ arrive on time.",["always","never","sometimes"],0],["We ___ breakfast at 8:00.",["have","do","make"],0],["He ___ his homework after school.",["does","makes","has"],0],["I ___ at 11 p.m. and sleep.",["go to bed","get dressed","wake up"],0]]},
/* ---------- A2 ---------- */
{id:"pas",lv:"A2",ic:"⏪",t:"Past Simple (o'tgan zamon)",
intro:`<p>O'tgan zamonda tugagan ish.</p><ul><li>To'g'ri fe'l: <b>-ed</b> → visit<b>ed</b>, work<b>ed</b></li><li>Noto'g'ri fe'l: go → <b>went</b>, buy → <b>bought</b>, eat → <b>ate</b>, see → <b>saw</b></li><li>Inkor va savol: <b>didn't / Did</b> + oddiy fe'l: I didn't <b>go</b>. Did you <b>go</b>?</li><li>Belgilar: yesterday, last year, in 2020, ago</li></ul>`,
w:[["I visited my uncle","Men amakimnikiga bordim"],["She went to Paris","U Parijga bordi"],["We didn't see him","Biz uni ko'rmadik"],["Did you call me?","Menga qo'ng'iroq qildingizmi?"],["He bought a new car","U yangi mashina sotib oldi"],["They ate pizza yesterday","Ular kecha pitsa yedi"],["I was very tired","Men juda charchagan edim"],["It happened last year","Bu o'tgan yili sodir bo'ldi"]],
g:[["Yesterday I ___ to the market.",["go","went","goed"],1],["She ___ not come to class.",["do","does","did"],2],["They ___ a movie last night.",["watched","watch","watching"],0],["___ you finish your homework?",["Do","Did","Were"],1],["He ___ his keys yesterday.",["lose","lost","losted"],1],["We ___ in London in 2020.",["was","were","are"],1]]},

const GN={quiz:"🧠 Viktorina",match:"🔗 Juftlik topish",build:"🧩 So'z / gap yig'ish",listen:"🎧 Eshit va tanla",gap:"✍️ Bo'sh joyni to'ldir",tf:"⚡ To'g'ri / Xato",speak:"🎤 Talaffuz"};
const PATH=["quiz","match","build","listen","gap","tf","speak"];
function qsQuiz(t){return pick(t.w,Math.min(8,t.w.length)).map((x,i)=>{const en=i%2===0;const wrong=pick(t.w.filter(y=>y!==x),3).map(y=>en?y[1]:y[0]);return{k:"mc",p:en?x[0]:x[1],say:en?x[0]:null,hl:en?"Tarjimasini tanlang":"Inglizchasini tanlang",o:shuffle(wrong.concat(en?x[1]:x[0])),a:en?x[1]:x[0]}})}
function qsListen(t){return pick(t.w,Math.min(7,t.w.length)).map(x=>{const wrong=pick(t.w.filter(y=>y!==x),3).map(y=>y[0]);return{k:"mc",p:"🎧 Eshiting va to'g'ri javobni tanlang",say:x[0],hide:true,o:shuffle(wrong.concat(x[0])),a:x[0]}})}
function qsGap(t){return shuffle(t.g).map(x=>({k:"mc",p:x[0],hl:"To'g'ri variantni tanlang",gap:true,o:shuffle(x[1]),a:x[1][x[2]]}))}
function qsTF(t){return pick(t.w,Math.min(8,t.w.length)).map(x=>{const ok=Math.random()<0.5;const other=pick(t.w.filter(y=>y!==x),1)[0];return{k:"mc",p:`«${x[0]}» = «${ok?x[1]:other[1]}»`,say:x[0],hl:"Tarjima to'g'rimi?",o:["To'g'ri ✅","Xato ❌"],a:ok?"To'g'ri ✅":"Xato ❌",expl:`${x[0]} = ${x[1]}`}})}
function qsBuild(t){return pick(t.w,Math.min(6,t.w.length)).map(x=>{const phrase=x[0].includes(" ");const tk=phrase?x[0].split(" "):x[0].split("");return{k:"build",hint:x[1],ans:x[0],join:phrase?" ":"",tokens:shuffle(tk),say:x[0]}})}
function qsSpeak(t){return pick(t.w,Math.min(5,t.w.length)).map(x=>({k:"speak",text:x[0],hint:x[1]}))}
function playGame(t,ty,cb,exit){
  if(ty==="match")return runMatch(t,cb,exit);
  const f={quiz:qsQuiz,listen:qsListen,gap:qsGap,tf:qsTF,build:qsBuild,speak:qsSpeak}[ty];
  runQs(f(t),{title:GN[ty]+" • "+t.t,exit},cb);
}

/* Savol harakatlantirgichi */
let G=null;
function runQs(qs,o,cb){G={qs,i:0,c:0,o,cb};showQ()}
function ghead(){return `<div class="gh"><button class="x" id="gx" title="Chiqish">✖</button><div class="bar"><i style="width:${Math.round(G.i/G.qs.length*100)}%"></i></div><b>${Math.min(G.i+1,G.qs.length)}/${G.qs.length}</b></div><div class="gt">${esc(G.o.title)}</div>`}
function exitG(){if(confirm("O'yindan chiqasizmi?")){speechSynthesis&&speechSynthesis.cancel();(G&&G.o.exit)?G.o.exit():go("home")}}
function feedback(ok,right,extra){
  S.total++;if(ok){G.c++;S.right++}save();
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><div><b>${ok?"✅ To'g'ri! +5 XP":"❌ To'g'ri javob:"}</b> ${ok?"":esc(right)}${extra?"<br><small>"+esc(extra)+"</small>":""}</div><button class="btn" id="nx">Davom etish ▶</button></div>`;
  $("#nx").onclick=()=>{G.i++;showQ()};
  $("#nx").focus();
}
function showQ(){
  if(G.i>=G.qs.length){return G.cb({c:G.c,t:G.qs.length})}
  const q=G.qs[G.i];let h=ghead()+`<div class="panel">`;

/* Juftlik topish */
function runMatch(t,cb,exit){
  let items=pick(t.w.filter(x=>x[0].length<=28),6);if(items.length<4)items=pick(t.w,6);
  const L=items.map((x,i)=>({id:i,txt:x[0]})),R=shuffle(items.map((x,i)=>({id:i,txt:x[1]})));
  let selL=null,selR=null,left=items.length,mist=0;
  app().innerHTML=`<div class="gh"><button class="x" id="gx">✖</button><div class="bar"><i id="mb" style="width:0%"></i></div></div><div class="gt">${esc(GN.match+" • "+t.t)}</div><div class="panel"><div class="hint">Inglizcha so'zni uning tarjimasi bilan juftlang</div><div class="mgrid"><div id="cl"></div><div id="cr"></div></div><div id="fb"></div></div>`;
  $("#gx").onclick=()=>{if(confirm("O'yindan chiqasizmi?"))exit?exit():go("home")};
  $("#cl").innerHTML=L.map(x=>`<button class="m" style="width:100%;margin-bottom:8px" data-s="l" data-id="${x.id}">${esc(x.txt)}</button>`).join("");
  $("#cr").innerHTML=R.map(x=>`<button class="m" style="width:100%;margin-bottom:8px" data-s="r" data-id="${x.id}">${esc(x.txt)}</button>`).join("");
  const test=()=>{if(selL===null||selR===null)return;const a=selL,b=selR;selL=selR=null;
    if(a.dataset.id===b.dataset.id){a.className=b.className="m done";left--;addXP(4);$("#mb").style.width=(100-left/items.length*100)+"%";S.right++;S.total++;if(!left){save();setTimeout(()=>cb({c:items.length,t:items.length+mist}),500)}}
    else{mist++;S.total++;[a,b].forEach(e=>{e.classList.remove("sel");e.classList.add("err");setTimeout(()=>e.classList.remove("err"),350)})}};
  $$(".m").forEach(b=>b.onclick=()=>{if(b.classList.contains("done"))return;const s=b.dataset.s;$$(`.m[data-s=${s}]`).forEach(x=>x.classList.remove("sel"));b.classList.add("sel");if(s==="l"){selL=b;speak(b.textContent)}else selR=b;test()});
}

/* Natija ekranlari */
function stars(p){return p>=85?3:p>=65?2:p>=40?1:0}
function runPath(t){
  let acc={c:0,t:0},k=0;
  const next=()=>{
    if(k>=PATH.length)return finishTopic(t,acc);
    const ty=PATH[k];
    playGame(t,ty,r=>{acc.c+=r.c;acc.t+=r.t;k++;
      app().innerHTML=`<div class="panel res"><div class="big">${r.c/r.t>=0.7?"🎉":"💪"}</div><h2>${esc(GN[ty])} tugadi</h2><p>Natija: <b>${r.c}/${r.t}</b></p><div class="bar" style="margin:12px auto;max-width:300px"><i style="width:${k/PATH.length*100}%"></i></div><p class="mut">${k}/${PATH.length} o'yin</p><button class="btn" id="go">${k>=PATH.length?"Yakuniy natija 🏁":"Keyingi o'yin ▶"}</button></div>`;
      $("#go").onclick=next},()=>openTopic(t.id));
  };next();
}
function finishTopic(t,acc){
  const p=Math.round(acc.c/Math.max(acc.t,1)*100),st=stars(p);
  const first=!(S.done[t.id]>0);
  S.done[t.id]=Math.max(S.done[t.id]||0,st);const bonus=st*20;addXP(bonus);save();
  const i=TOPICS.indexOf(t),nx=TOPICS[i+1];
  app().innerHTML=`<div class="panel res"><div class="big">${["😕","⭐","⭐⭐","⭐⭐⭐"][st]}</div><h2>${st>=2?"Ajoyib!":st===1?"Yaxshi, lekin yana urinib ko'ring":"Mavzuni qayta o'qing"}</h2><p>To'g'ri javoblar: <b>${acc.c}/${acc.t}</b> (${p}%)</p><p>Bonus: <b>+${bonus} XP</b></p><p class="mut">${st<3?"3 yulduz uchun 85% kerak. Darsni qayta o'qib, yana o'ynang!":"Mavzu o'zlashtirildi!"}</p><button class="btn" id="b1">Mavzuga qaytish</button><button class="btn sec" id="b2">🔁 Qayta o'ynash</button>${nx?`<button class="btn ok" id="b3">Keyingi mavzu ▶</button>`:""}</div>`;
  $("#b1").onclick=()=>openTopic(t.id);$("#b2").onclick=()=>runPath(t);if(nx)$("#b3").onclick=()=>openTopic(nx.id);
}
function singleGame(t,ty){
  playGame(t,ty,r=>{const p=Math.round(r.c/r.t*100);addXP(stars(p)*5);
    app().innerHTML=`<div class="panel res"><div class="big">${p>=70?"🎉":"💪"}</div><h2>${GN[ty]}</h2><p>Natija: <b>${r.c}/${r.t}</b> (${p}%)</p><button class="btn" id="b1">Mavzuga qaytish</button><button class="btn sec" id="b2">🔁 Qayta</button></div>`;
    $("#b1").onclick=()=>openTopic(t.id);$("#b2").onclick=()=>singleGame(t,ty)},()=>openTopic(t.id));
}

  $("#mic").onclick=()=>{if(!SRC){alert("Bu brauzer mikrofonni qo'llamaydi. Chrome da oching yoki javobni yozing.");return}

function speechReport(tx,sec){
  const low=tx.toLowerCase(),words=low.match(/[a-z']+/g)||[],n=words.length;
  const fill=FILL.filter(f=>new RegExp("\\b"+f+"\\b").test(low));const links=LINK.filter(l=>low.includes(l));
  const uniq=new Set(words).size,ttr=uniq/n;const need=SPS.part===1?25:SPS.part===2?150:60;
  let tips=[];
  tips.push(n>=need?`✅ Uzunlik yaxshi: ${n} so'z.`:`⚠️ Javob qisqa (${n} so'z). Maqsad: kamida ~${need} so'z. Sabab va misol qo'shing.`);
  tips.push(links.length>=3?`✅ Bog'lovchilar ishlatildi: ${links.slice(0,6).join(", ")}.`:`⚠️ Bog'lovchi kam. Qo'shing: however, for example, as a result, in addition.`);
  tips.push(fill.length>2?`⚠️ To'ldiruvchi so'zlar ko'p: ${fill.join(", ")}. Pauza qiling yoki "well, let me think" deng.`:`✅ To'ldiruvchi so'zlar kam.`);
  tips.push(ttr>0.6?`✅ Lug'at boyligi yaxshi.`:`⚠️ So'zlar takrorlanyapti. Sinonimlardan foydalaning.`);
  if(sec>10){const wpm=Math.round(n/(sec/60));tips.push(`🕒 Tezlik: ~${wpm} so'z/daqiqa (ideal 110–150).`)}
  if(/\bif\b/.test(low)||/\bwhich\b|\bwho\b/.test(low))tips.push("✅ Murakkab tuzilma ishlatildi (if / who / which).");else tips.push("⚠️ Murakkab gaplar qo'shing: If…, …which…, …who….");
  return `<div class="an"><b>📊 Tahlil</b> (so'zlar: ${n})<ul>${tips.map(t=>"<li>"+t+"</li>").join("")}</ul><small class="mut">Bu avtomatik, taxminiy tahlil; real ustoz o'rnini bosmaydi.</small></div>`;
}

function writeReport(tx,w){
  const low=tx.toLowerCase(),words=low.match(/[a-z']+/g)||[],n=words.length;
  if(n<20)return `<div class="an">Avval ko'proq yozing (kamida bir necha gap).</div>`;
  const paras=tx.split(/\n\s*\n/).filter(x=>x.trim()).length;
  const sents=tx.split(/[.!?]+/).filter(x=>x.trim().length>2),avg=n/Math.max(sents.length,1);
  const links=ESSAY_LINKS.filter(l=>low.includes(l));const uniq=new Set(words).size,ttr=uniq/n;
  const longw=words.filter(x=>x.length>=8).length/n;
  const cx=(low.match(/\b(if|unless|although|whereas|while|which|who|whose|that|because|despite|having)\b/g)||[]).length;
  const pas=/\b(is|are|was|were|been|be)\s+\w+(ed|en)\b/.test(low);
  const contr=(tx.match(/\b\w+'(t|s|re|ve|ll|d|m)\b/gi)||[]).filter(x=>!/'s$/i.test(x));
  const cnt={};words.forEach(x=>{if(x.length>4)cnt[x]=(cnt[x]||0)+1});const rep=Object.entries(cnt).filter(e=>e[1]>=4).map(e=>e[0]+" ("+e[1]+")");
  let b=3.5,tips=[];
  if(n>=w.min){b+=1;tips.push(`✅ So'z soni yetarli: ${n}.`)}else{tips.push(`⚠️ So'z kam: ${n}/${w.min}. Band pasayadi.`)}
  if(w.min>=250){if(paras>=4){b+=.5;tips.push("✅ 4+ abzats — tuzilma yaxshi.")}else tips.push("⚠️ Essay uchun 4 abzats yozing: intro, 2 body, conclusion.")}
  if(links.length>=4){b+=.5;tips.push(`✅ Bog'lovchilar: ${links.slice(0,6).join(", ")}.`)}else tips.push("⚠️ Bog'lovchi kam: However, Moreover, For example, As a result…");
  if(ttr>0.5){b+=.5;tips.push("✅ Lug'at xilma-xil.")}else tips.push("⚠️ Takror ko'p — sinonimlar toping.");
  if(avg>=13&&avg<=26){b+=.5;tips.push(`✅ Gap uzunligi mos (o'rtacha ${avg.toFixed(1)} so'z).`)}else tips.push(avg<13?"⚠️ Gaplar juda qisqa — qo'shib, murakkablashtiring.":"⚠️ Gaplar juda uzun — bo'lib yozing.");
  if(cx>=5){b+=.5;tips.push("✅ Murakkab tuzilmalar bor (if/which/although...).")}else tips.push("⚠️ Murakkab gaplar qo'shing: although, which, if.");
  if(longw>0.12){b+=.5;tips.push("✅ Akademik (uzun) so'zlar bor.")}
  if(pas){b+=.25;tips.push("✅ Majhul nisbat ishlatilgan.")}
  if(contr.length){tips.push(`⚠️ Qisqartmalar topildi (${contr.slice(0,3).join(", ")}). Rasmiy yozuvda to'liq yozing.`)}
  if(rep.length)tips.push(`⚠️ Ko'p takrorlangan so'zlar: ${rep.slice(0,4).join(", ")}.`);
  if(!/[A-Z]/.test(tx[0]))tips.push("⚠️ Bosh harfga e'tibor bering.");
  if(n<w.min*0.6)b=Math.min(b,4.5);b=Math.min(b,7);
  return `<div class="an"><b>📊 Taxminiy band: ${b.toFixed(1)}</b> (so'z: ${n}, abzats: ${paras})<ul>${tips.map(t=>"<li>"+t+"</li>").join("")}</ul><small class="mut">Bu faqat so'z soni, tuzilma va lug'at bo'yicha avtomatik baho. Mazmun va grammatikani ustoz bilan tekshirtiring.</small></div>`;
}

  <details><summary>📊 Band darajalari</summary><table><tr><th>Band</th><th>Daraja</th><th>Ma'nosi</th></tr><tr><td>4.0–5.0</td><td>A2–B1</td><td>Cheklangan foydalanuvchi</td></tr><tr><td>5.5–6.0</td><td>B1+</td><td>O'rtacha foydalanuvchi — ko'p xatolar</td></tr><tr><td>6.5–7.0</td><td>B2</td><td>Yaxshi — universitet uchun odatda 6.0–6.5</td></tr><tr><td>7.5+</td><td>C1</td><td>Juda yaxshi — erkin muloqot</td></tr></table></details>
  <details><summary>🗓 30 kunlik reja</summary><ol><li><b>1-hafta (A1–A2):</b> Darslar bo'limida A1–A2 mavzularini 7 ta o'yin bilan tugating. Kuniga 1 mavzu + 10 ta yangi so'z.</li><li><b>2-hafta (B1):</b> Zamonlar, modal fe'llar, ta'lim lug'ati. Har kuni 1 ta Reading + 1 ta diktant.</li><li><b>3-hafta (B2):</b> Shart gaplar, passive, reported speech. Haftada 2 ta Task 2 essay. Kunda Speaking Part 1+3 mashqi.</li><li><b>4-hafta (C1):</b> Akademik so'zlar, Task 1 lug'ati, mini mock test. Har kuni 1 ta Part 2 (2 daqiqa).</li></ol></details>
  <details><summary>🎯 Har bir bo'lim uchun strategiya</summary><ul><li><b>Listening:</b> savollarni oldindan o'qing; so'z imlosiga e'tibor; javobni darrov yozing.</li><li><b>Reading:</b> skimming + scanning; True/False/Not Given'da «matnda yo'q = Not Given».</li><li><b>Writing:</b> 5 daqiqa reja → yozish → 3 daqiqa tekshirish.</li><li><b>Speaking:</b> javobni uzaytiring (Answer + Reason + Example). Pauza qilsangiz ham tabiiy bo'ling.</li></ul></details>
  <details><summary>🧠 Samarali yodlash usullari</summary><ul><li>Har kuni <b>10 ta so'z</b> + 10 ta gap tuzing.</li><li>3-kun, 7-kun, 14-kunda qayta takrorlang (spaced repetition).</li><li>O'yinlarni qayta-qayta o'ynang — natijani 3 yulduzga yetkazing.</li><li>Kunda 10 daqiqa inglizcha podkast / video tinglang.</li></ul></details>
  <h3>🧪 Mini mock test</h3><p class="mut">Grammatika va lug'atdan 16 ta aralash savol. Oxirida taxminiy band beriladi.</p><button class="btn ok" id="mock">▶ Mock testni boshlash</button>
  <div id="hist"></div>`;
  $("#mock").onclick=()=>{const all=[].concat(...TOPICS.map(t=>t.g.map(x=>({k:"mc",p:x[0],hl:t.t,gap:true,o:shuffle(x[1]),a:x[1][x[2]]}))));
    runQs(pick(all,16),{title:"🧪 IELTS mini mock",exit:()=>go("ielts")},r=>{const p=r.c/r.t*100,band=p>=90?8:p>=80?7:p>=70?6.5:p>=60?6:p>=50?5.5:p>=40?5:p>=30?4.5:4;S.mocks.push({d:dayStr(Date.now()),c:r.c,t:r.t,b:band});addXP(r.c*3);save();
      app().innerHTML=`<div class="panel res"><div class="big">🎓</div><h2>Mock natija: ${r.c}/${r.t}</h2><h2 style="color:var(--pri)">Taxminiy band: ${band}</h2><p class="mut">Bu faqat grammatika/lug'at darajasini ko'rsatadi.</p><button class="btn" id="b">Orqaga</button></div>`;$("#b").onclick=()=>go("ielts")})};
  if(S.mocks.length)$("#hist").innerHTML=`<h3>Oldingi mocklar</h3><table><tr><th>Sana</th><th>Natija</th><th>Band</th></tr>${S.mocks.slice(-5).reverse().map(m=>`<tr><td>${m.d}</td><td>${m.c}/${m.t}</td><td>${m.b}</td></tr>`).join("")}</table>`;
}

/* ---------- NATIJA ---------- */
function viewStat(){
  const acc=S.total?Math.round(S.right/S.total*100):0,done=Object.keys(S.done).length;
  let lvl="Boshlovchi",ielts="—";const ord=["A1","A2","B1","B2","C1"],map={A1:"~3.0",A2:"3.5–4.0",B1:"4.5–5.5",B2:"6.0–6.5",C1:"7.0+"};
  for(const l of ord){const ts=TOPICS.filter(t=>t.lv===l),d=ts.filter(t=>S.done[t.id]>0).length;if(d>=Math.ceil(ts.length*0.6)){lvl=l;ielts=map[l]}else break}
  const B=[["🌱","Birinchi qadam",done>=1],["📚","5 ta mavzu",done>=5],["🔥","3 kunlik streak",S.streak>=3],["⭐","500 XP",S.xp>=500],["💎","1500 XP",S.xp>=1500],["🏅","10 ta mavzu",done>=10],["👑","Barcha mavzular",done>=TOPICS.length],["🎯","80% aniqlik",acc>=80&&S.total>=50]];
  app().innerHTML=`<h2>🏆 Sizning natijalaringiz</h2><div class="grid"><div class="card"><div class="big">${S.xp}</div>XP ball</div><div class="card"><div class="big">${S.streak}</div>kunlik streak</div><div class="card"><div class="big">${done}/${TOPICS.length}</div>mavzu tugagan</div><div class="card"><div class="big">${acc}%</div>aniqlik (${S.right}/${S.total})</div></div><div class="hero" style="margin-top:14px"><h3>Taxminiy darajangiz: <span style="color:var(--pri)">${lvl}</span> ${ielts!=="—"?"• IELTS "+ielts:""}</h3><p class="mut">Daraja har bir bosqichdagi mavzularning kamida 60% ini tugatishingizga qarab hisoblanadi.</p></div><h3>🎖 Yutuqlar</h3>${B.map(b=>`<span class="badge ${b[2]?"":"off"}">${b[0]} ${b[1]}</span>`).join("")}<h3>Mavzular bo'yicha</h3><table><tr><th>Mavzu</th><th>Daraja</th><th>Yulduz</th></tr>${TOPICS.map(t=>`<tr><td>${t.ic} ${t.t}</td><td>${t.lv}</td><td class="stars">${"★".repeat(S.done[t.id]||0)||"—"}</td></tr>`).join("")}</table><p><button class="btn red" id="rs">Hammasini o'chirish</button></p>`;
  $("#rs").onclick=()=>{if(confirm("Barcha natijalar o'chiriladi. Ishonchingiz komilmi?")){S={xp:0,streak:0,last:"",done:{},right:0,total:0,reading:{},listening:{},mocks:[]};save();head();render()}};
}

/* ============ BOSHLASH ============ */
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}catch(e){}
head();render();
</script>
